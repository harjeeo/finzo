services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finzo
      POSTGRES_PASSWORD: finzo
      POSTGRES_DB: finzo
    ports:
      # Host port 5433 to avoid clashing with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - finzo_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - finzo_redis_data:/data

volumes:
  finzo_postgres_data:
  finzo_redis_data:
